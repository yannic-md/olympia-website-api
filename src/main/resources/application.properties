spring.application.name=main

# Production Profile (MariaDB via Docker)
spring.datasource.url=jdbc:mariadb://localhost:3306/olympia?createDatabaseIfNotExist=true
spring.datasource.username=user
spring.datasource.password=secret
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Docker Compose Support - disabled to avoid daemon connection issues
spring.docker.compose.enabled=false

# Session cookie configuration ? 24h lifetime
server.servlet.session.timeout=86400s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.path=/

